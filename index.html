<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cargas Disponíveis</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      padding: 20px;
      margin: 0;
      font-size: 14px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 15px;
      width: 90%;
      max-width: 500px;
      transition: transform 0.2s;
      font-size: 13px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card p {
      margin: 6px 0;
      color: #444;
      line-height: 1.6;
    }

    .card p strong {
      color: #222;
    }
  </style>
</head>
<body>

  <h1>Cargas Disponíveis</h1>
  <div class="container" id="cards-container"></div>

  <script>
    setInterval(() => {
      location.reload();
    }, 60000);

    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQRqIOROs3SOPKiIlEEVi53cuzFf6h7UQA-QxtDAj0cgUBDU2cpZJa-ul55wp-cs2xgZCSUWyOlHzxB/pub?gid=160529133&single=true&output=csv';

    fetch(csvUrl)
      .then(response => response.text())
      .then(csvText => {
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            const data = results.data;
            const container = document.getElementById('cards-container');

            data.forEach(row => {
              const normalizedRow = {};
              for (const key in row) {
                const normalizedKey = key.trim().toLowerCase();
                normalizedRow[normalizedKey] = row[key];
              }

              const card = document.createElement('div');
              card.className = 'card';

              let html = '';

              // Linha mesclada: ORIGEM + UF ORIGEM
              const origem = normalizedRow['origem'] || '';
              const ufOrigem = normalizedRow['uf origem'] || '';
              if (origem || ufOrigem) {
                html += `<p><strong>Origem:</strong> ${origem}${ufOrigem ? ' - ' + ufOrigem : ''}</p>`;
              }

              // Linha mesclada: DESTINO + UF DESTINO
              const destino = normalizedRow['destino'] || '';
              const ufDestino = normalizedRow['uf destino'] || '';
              if (destino || ufDestino) {
                html += `<p><strong>Destino:</strong> ${destino}${ufDestino ? ' - ' + ufDestino : ''}</p>`;
              }

              for (const key in normalizedRow) {
                if (
                  key.includes('e-mail') ||
                  key === 'uf origem' ||
                  key === 'uf destino' ||
                  key === 'origem' ||
                  key === 'destino'
                ) continue;

                html += `<p><strong>${key}:</strong> ${normalizedRow[key]}</p>`;
              }

              card.innerHTML = html;
              container.appendChild(card);
            });
          }
        });
      })
      .catch(error => {
        console.error('Erro ao buscar dados da planilha:', error);
        document.getElementById('cards-container').innerHTML = '<p>Erro ao carregar os dados.</p>';
      });
  </script>

  <p>Volte até a aba Transportadoras e encontre os contatos da sua carga!</p>
</body>
</html>
